<!DOCTYPE html>
<html>
<head>
  <title>Pink Polka ✨</title>
  <style>
    body {
      margin: 0;
      background-color: #ffc0cb;
      background-image: radial-gradient(#c2185b 12%, transparent 13%);
      background-size: 40px 40px;
      font-family: 'Comic Sans MS', cursive;
      min-height: 200vh;
      overflow-x: hidden;
      position: relative;
    }

    h1 {
      text-align: center;
      color: #c2185b;
      font-size: 3em;
      margin-top: 20%;
      text-shadow: 2px 2px white;
    }

    .dot {
      position: absolute;
      width: 10px;
      height: 10px;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: floatUp linear infinite;
      filter: blur(1px);
      box-shadow: 0 0 5px #fff;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(1);
        opacity: 0;
      }
      30% {
        opacity: 1;
      }
      100% {
        transform: translateY(-50vh) scale(1.2);
        opacity: 0;
      }
    }

    /* Generate 20 animated sparkles with different positions/speeds */
    .dot:nth-child(2)  { left: 5%;  animation-duration: 7s; animation-delay: 0s; }
    .dot:nth-child(3)  { left: 15%; animation-duration: 8s; animation-delay: 1s; }
    .dot:nth-child(4)  { left: 25%; animation-duration: 6s; animation-delay: 2s; }
    .dot:nth-child(5)  { left: 35%; animation-duration: 5s; animation-delay: 1.5s; }
    .dot:nth-child(6)  { left: 45%; animation-duration: 9s; animation-delay: 3s; }
    .dot:nth-child(7)  { left: 55%; animation-duration: 6s; animation-delay: 0.5s; }
    .dot:nth-child(8)  { left: 65%; animation-duration: 7s; animation-delay: 2.5s; }
    .dot:nth-child(9)  { left: 75%; animation-duration: 10s; animation-delay: 1s; }
    .dot:nth-child(10) { left: 85%; animation-duration: 8s; animation-delay: 0.3s; }
    .dot:nth-child(11) { left: 95%; animation-duration: 6s; animation-delay: 1.8s; }
    .dot:nth-child(12) { left: 20%; animation-duration: 7s; animation-delay: 1.2s; }
    .dot:nth-child(13) { left: 30%; animation-duration: 5s; animation-delay: 2s; }
    .dot:nth-child(14) { left: 50%; animation-duration: 9s; animation-delay: 0.6s; }
    .dot:nth-child(15) { left: 60%; animation-duration: 6s; animation-delay: 2.3s; }
    .dot:nth-child(16) { left: 70%; animation-duration: 7s; animation-delay: 1.6s; }
    .dot:nth-child(17) { left: 80%; animation-duration: 8s; animation-delay: 2.8s; }
    .dot:nth-child(18) { left: 90%; animation-duration: 10s; animation-delay: 0.9s; }
    .dot:nth-child(19) { left: 10%; animation-duration: 6s; animation-delay: 3.1s; }
    .dot:nth-child(20) { left: 40%; animation-duration: 5s; animation-delay: 2.2s; }
    .dot:nth-child(21) { left: 60%; animation-duration: 8s; animation-delay: 0.7s; }
  </style>
</head>
<body>
  <h1>💖 Polka + Magic Vibes 💖</h1>

  <!-- Sparkling floating dots -->
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</body>
</html>
