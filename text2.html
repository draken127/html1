<!DOCTYPE html>
<html>
<head>
  <title>Floating Dots 💖</title>
  <style>
    body {
      margin: 0;
      background: #ffc0cb;
      overflow-x: hidden;
      font-family: 'Comic Sans MS', cursive;
      min-height: 200vh;
      position: relative;
    }

    .dot {
      position: absolute;
      width: 20px;
      height: 20px;
      background: #c2185b;
      border-radius: 50%;
      opacity: 0.8;
      animation: floatUp linear infinite;
      box-shadow: 0 0 10px #c2185b, 0 0 20px #c2185b;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(1);
        opacity: 0;
      }
      30% {
        opacity: 1;
      }
      100% {
        transform: translateY(-50vh) scale(1.5);
        opacity: 0;
      }
    }

    /* Random dot positions and speeds */
    .dot:nth-child(1)  { left: 10%; animation-duration: 6s; animation-delay: 0s; }
    .dot:nth-child(2)  { left: 25%; animation-duration: 8s; animation-delay: 2s; }
    .dot:nth-child(3)  { left: 40%; animation-duration: 7s; animation-delay: 1s; }
    .dot:nth-child(4)  { left: 55%; animation-duration: 5s; animation-delay: 3s; }
    .dot:nth-child(5)  { left: 70%; animation-duration: 6s; animation-delay: 0s; }
    .dot:nth-child(6)  { left: 85%; animation-duration: 9s; animation-delay: 1.5s; }

    h1 {
      text-align: center;
      margin-top: 20%;
      color: #c2185b;
      font-size: 3em;
      text-shadow: 2px 2px white;
    }
  </style>
</head>
<body>
  <h1>💖 Floating Dot Aesthetic 💖</h1>

  <!-- Floating dots -->
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
</body>
</html>
