<!DOCTYPE html>
<html lang="en">
<head>
    <title>continuation</title>
</head>

<body>
    <h2>Store hours</h2>
    <table bgcolor="black" width="700"><!--table-->
        <!--we can have bg color here too it works like border color of rows and columns-->
        <!--width= number of cells * width of each cell for a good table-->
        <tr bgcolor="red" align="center"><!--to create table row-->
            <!--bgcolor for uk whole row-->
            <!--we can align text too for whole row usig align-->
            <th width="100">Sunday</th><!--th for table header-->
            <th width="100">Monday</th>
            <th width="100">Tuesday</th>
            <th width="100">Wednesday</th>
            <th width="100">Thursday</th>
            <th width="100">Friday</th>
            <th width="100">Saturday</th>
        </tr>
        <tr bgcolor="green" align="center"><!--create another row-->
            <td>Closed</td><!--for table description-->
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>9-5</td>
            <td>Closed</td>
        </tr>
    </table>
</body>    
</html>
